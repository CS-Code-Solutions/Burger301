<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erro no Servidor - Burger 301</title>
    <link rel="icon" href="imagens/icone.png" type="image/png">
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #121212;
            color: #fff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            box-sizing: border-box;
        }
        .erro-container {
            max-width: 400px;
            background: #1e1e1e;
            padding: 30px 20px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border: 1px solid rgba(242, 140, 40, 0.4);
        }
        h1 { color: #f28c28; font-size: 2.5rem; margin-bottom: 10px; }
        p { color: #ccc; font-size: 1rem; margin-bottom: 25px; line-height: 1.5; }
        .btn-voltar {
            display: inline-block;
            background-color: #f28c28;
            color: white;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="erro-container">
        <h1>500</h1>
        <p>Estamos a enfrentar uma instabilidade temporária nos servidores. Por favor, tente novamente em instantes.</p>
        <a href="/" class="btn-voltar">Tentar Novamente</a>
    </div>
</body>
</html>
