<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Não Encontrada - Burger 301</title>
    <link rel="icon" href="imagens/icone.png" type="image/png">
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #121212;
            color: #fff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            box-sizing: border-box;
        }
        .erro-container {
            max-width: 400px;
            background: #1e1e1e;
            padding: 30px 20px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border: 1px solid rgba(242, 140, 40, 0.4);
        }
        h1 {
            color: #f28c28;
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        p {
            color: #ccc;
            font-size: 1rem;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        .btn-voltar {
            display: inline-block;
            background-color: #f28c28;
            color: white;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: bold;
            transition: background-color 0.2s, transform 0.2s;
        }
        .btn-voltar:hover {
            background-color: #d96f0c;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="erro-container">
        <img src="imagens/icone.png" alt="Burger 301" style="width: 70px; height: 70px; border-radius: 50%; object-fit: cover; margin-bottom: 15px; border: 2px solid #f28c28;">
        <h1>404</h1>
        <p>Ops! Parece que o hambúrguer que procurava sumiu do cardápio ou o link está incorreto.</p>
        <a href="/" class="btn-voltar">Voltar ao Início</a>
    </div>
</body>
</html>
